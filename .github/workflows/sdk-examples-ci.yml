# Format check and build for SDK examples (runs only on PRs)
# Each job runs only when files in its path were changed.
name: SDK Examples CI

on:
  pull_request:

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      dotnet: ${{ steps.filter.outputs.dotnet }}
      typescript: ${{ steps.filter.outputs.typescript }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            dotnet:
              - 'sdk/dotnet/**'
              - '.github/workflows/sdk-examples-ci.yml'
            typescript:
              - 'sdk/typescript/**'
              - '.github/workflows/sdk-examples-ci.yml'

  dotnet:
    name: C# format & build
    needs: changes
    if: needs.changes.outputs.dotnet == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk/dotnet/web-api

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Restore
        run: dotnet restore

      - name: Format check
        run: dotnet format --verify-no-changes --no-restore

      - name: Build
        run: dotnet build --no-restore -c Release

  typescript:
    name: TypeScript ${{ matrix.project.name }} lint & build
    needs: changes
    if: needs.changes.outputs.typescript == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project:
          - name: express-web-api
            path: sdk/typescript/express-web-api
          - name: next-auth-examples
            path: sdk/typescript/next-auth-examples
    defaults:
      run:
        working-directory: ${{ matrix.project.path }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: ${{ matrix.project.path }}/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint (Biome)
        run: npm run lint

      - name: Build
        run: npm run build
