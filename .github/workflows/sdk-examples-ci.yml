# Format check and build for SDK examples (runs only on PRs)
# Each job runs only when files in its path were changed.
name: SDK Examples CI

on:
  pull_request:

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      dotnet: ${{ steps.dotnet-filter.outputs.dotnet }}
      ts_projects: ${{ steps.ts-filter.outputs.changes }}
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: dotnet-filter
        with:
          filters: |
            dotnet:
              - 'sdk/dotnet/**'
              - '.github/workflows/sdk-examples-ci.yml'

      # Each filter name must match an `include` entry in the typescript matrix.
      # To add a project: add a filter here + an include entry in the typescript job.
      - uses: dorny/paths-filter@v3
        id: ts-filter
        with:
          filters: |
            express-web-api:
              - 'sdk/typescript/express-web-api/**'
              - '.github/workflows/sdk-examples-ci.yml'
            next-auth-examples:
              - 'sdk/typescript/next-auth-examples/**'
              - '.github/workflows/sdk-examples-ci.yml'
            react-next-agent-chat:
              - 'agents/react/next-agent-chat/**'
              - '.github/workflows/sdk-examples-ci.yml'

  dotnet:
    name: C# format & build
    needs: changes
    if: needs.changes.outputs.dotnet == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk/dotnet/web-api

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Restore
        run: dotnet restore

      - name: Format check
        run: dotnet format --verify-no-changes --no-restore

      - name: Build
        run: dotnet build --no-restore -c Release

  typescript:
    name: TypeScript ${{ matrix.project }} lint & build
    needs: changes
    if: needs.changes.outputs.ts_projects != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: ${{ fromJson(needs.changes.outputs.ts_projects) }}
        include:
          - project: express-web-api
            path: sdk/typescript/express-web-api
          - project: next-auth-examples
            path: sdk/typescript/next-auth-examples
          - project: react-next-agent-chat
            path: agents/react/next-agent-chat

    defaults:
      run:
        working-directory: ${{ matrix.path }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: ${{ matrix.path }}/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint (Biome)
        run: npm run lint

      - name: Build
        run: npm run build
