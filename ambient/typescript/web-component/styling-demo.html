<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>Styling Demo</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.classless.min.css"
    />
    <style>
      corti-ambient {
        color-scheme: light;
        --card-background: light-dark(#fbfcfc, #1c212c);
      }
    </style>
  </head>
  <body>
    <header>
      <nav><a href="index.html">← Back to Demo Index</a></nav>
      <h1>Styling Demo</h1>
      <p>
        Customize the Ambient Web Component with CSS custom properties and
        <code>color-scheme</code>. See the
        <a href="https://docs.corti.ai/sdk/ambient/styling">styling guide</a>.
      </p>
    </header>

    <main>
      <div class="theme-picker">
        <label for="themeToggle">
          <input type="checkbox" id="themeToggle" role="switch" />
          Dark mode
        </label>
      </div>

      <article id="componentPlaceholder" aria-busy="true">
        <corti-ambient settingsEnabled=""></corti-ambient>
      </article>

      <textarea
        id="transcript"
        rows="6"
        placeholder="Transcript will appear here…"
      ></textarea>
    </main>

    <script type="module">
      import "https://cdn.jsdelivr.net/npm/@corti/ambient-web@0.7.0-ambient.19/dist/bundle.js";

      const ambient = document.querySelector("corti-ambient");
      const componentPlaceholder = document.getElementById("componentPlaceholder");
      const transcriptArea = document.getElementById("transcript");
      const themeToggle = document.getElementById("themeToggle");

      const { interactionId, accessToken } = await fetch("/api/start-session", {
        method: "POST",
      }).then((r) => r.json());

      ambient.interactionId = interactionId;
      ambient.accessToken = accessToken;
      componentPlaceholder.setAttribute("aria-busy", "false");

      const applyTheme = (isDark) => {
        const theme = isDark ? "dark" : "light";
        document.documentElement.setAttribute("data-theme", theme);
        themeToggle.checked = isDark;
        ambient.style.colorScheme = theme;
      };

      const prefersDark =
        window.matchMedia?.("(prefers-color-scheme: dark)").matches ?? false;
      applyTheme(prefersDark);
      themeToggle.addEventListener("change", (e) =>
        applyTheme(e.target.checked),
      );

      ambient.addEventListener("transcript", (e) => {
        for (const segment of e.detail.data ?? []) {
          if (segment.final) {
            transcriptArea.value += segment.transcript + " ";
          }
        }
      });
    </script>
  </body>
</html>
